<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


            <div class="navbar">
            <div class="logo">
              <img src="images/1.5.png" alt="logo"  width="125px">
              
            </div>  
            <h1 class="brand-name">GEN-Z WEAR APPAREL</h1>
            <div class="menu-toggle" id="menu-toggle">☰</div>                          
          <nav>
            <ul id="nav-links">
                
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop Now</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="about.html">About</a></li>
                
            </ul>
            
          </nav>
          
        </div>

<div class="checkout-container">

  <!-- LEFT SIDE -->
  <div class="checkout-summary">
    <h2>Order Summary</h2>
    <div id="order-summary"></div>

    <h3>Total: <span id="total">P0</span></h3>
  </div>

  <!-- RIGHT SIDE -->
  <div class="checkout-form">
    <h2>Customer Details</h2>

    <form id="checkout-form">

  <!-- CUSTOMER INFO -->
  <input type="text" placeholder="Full Name" required>
  <input type="text" placeholder="Address" required>
  <input type="text" placeholder="Phone Number" required>

  <!-- PAYMENT METHODS -->
  <h2>Payment Method</h2>

  <div class="payment-option active">
    <i class="fa-solid fa-credit-card"></i>
    Credit or Debit Card
  </div>

  <div class="payment-option">
    <i class="fa-brands fa-paypal"></i>
    PayPal
  </div>

  
  <!-- CARD DETAILS -->
  <h3>Enter your payment details:</h3>

  <input type="text" placeholder="Name on card *" required>
  <input type="text" placeholder="Card number *" required>

  <div class="card-row">
    <input type="text" placeholder="MM/YY *" required>
    <input type="text" placeholder="Security Code *" required>
  </div>

  <button class="checkout-btn">Place Order</button>

</form>
  </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;

let summary = document.getElementById("order-summary");

cart.forEach(item => {
  let itemTotal = item.price * item.quantity;
  total += itemTotal;

 summary.innerHTML += `
  <p>
    <strong>${item.name}</strong><br>
    Qty: ${item.quantity} <br>
    Total: P${itemTotal}
  </p>
`;
});

document.getElementById("total").innerText = "P" + total;

document.getElementById("checkout-form").addEventListener("submit", function(e){
  e.preventDefault();
  alert("Order placed successfully!");
  localStorage.removeItem("cart");
  window.location.href = "index.html";
});
</script>
<script>
  const toggle = document.getElementById("menu-toggle");
  const navLinks = document.getElementById("nav-links");

  toggle.addEventListener("click", () => {
    navLinks.classList.toggle("active");
  });
</script>


<script>
const options = document.querySelectorAll(".payment-option");

options.forEach(option => {
  option.addEventListener("click", () => {
    options.forEach(o => o.classList.remove("active"));
    option.classList.add("active");
  });
});
</script>
</body>
</html>
